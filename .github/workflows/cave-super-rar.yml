name: cave catalog observation checks

# Read-only gate: rebuild catalog observations in memory, compare committed
# JSON, and exercise safe defaults. It never writes back, packages code,
# installs an artifact, streams an entry, or accepts a catalog record.
on:
  pull_request:
    paths:
      - '.github/ISSUE_TEMPLATE/place-submission.yml'
      - '.github/prompts/**'
      - '.well-known/rapp-network-seed.json'
      - 'cave/agents/**'
      - 'cave/cubbies/**'
      - 'cave/facets.json'
      - 'cave/README.md'
      - 'cave/rar/index.json'
      - 'cave/specs/**'
      - 'cave/super-rar/index.json'
      - 'cave/tests/test_catalog_containment.py'
      - 'cave/tools/build_super_rar.py'
      - '.github/workflows/cave-super-rar.yml'
      - 'llms.txt'
      - 'rapp-ai.json'
  push:
    branches: [main]
    paths:
      - '.github/ISSUE_TEMPLATE/place-submission.yml'
      - '.github/prompts/**'
      - '.well-known/rapp-network-seed.json'
      - 'cave/agents/**'
      - 'cave/cubbies/**'
      - 'cave/facets.json'
      - 'cave/README.md'
      - 'cave/rar/index.json'
      - 'cave/specs/**'
      - 'cave/super-rar/index.json'
      - 'cave/tests/test_catalog_containment.py'
      - 'cave/tools/build_super_rar.py'
      - '.github/workflows/cave-super-rar.yml'
      - 'llms.txt'
      - 'rapp-ai.json'

permissions:
  contents: read

jobs:
  validate-observation-catalogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check rendered Cave observations
        run: python3 cave/tools/build_super_rar.py --check
      - name: Test retention and safe defaults
        run: python3 cave/tests/test_catalog_containment.py
