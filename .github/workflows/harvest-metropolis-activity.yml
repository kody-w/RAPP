name: Harvest metropolis activity

# Static Data Covenant (kody-w/RAR CONSTITUTION.md Article XXIV): the
# metropolis page's visitor browser must never call api.github.com. This
# workflow is the CI harvester — it runs on a schedule, calls the GitHub
# events API for each public neighborhood in pages/metropolis/index.json,
# and commits the trimmed result to pages/metropolis/activity-snapshot.json.
# The page (pages/metropolis/index.html) only ever reads that committed file.

on:
  schedule:
    - cron: '23 * * * *'  # hourly
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Harvest activity snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/harvest-metropolis-activity.py

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- pages/metropolis/activity-snapshot.json; then
            echo "no change"
            exit 0
          fi
          git add pages/metropolis/activity-snapshot.json
          git commit -m "chore: harvest metropolis activity snapshot"
          git push
