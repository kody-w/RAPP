name: "🛑 Historical place intake (blocked)"
description: "Record historical context only. This form cannot plant, seed, join, or create a RAPP place."
title: "[historical-place] "
labels: ["place-submission", "blocked"]
body:
  - type: markdown
    attributes:
      value: |
        ## Historical intake only

        Read `RAPP1_AUTHORITY.json` and `RAPP1_STATUS.md` before relying on any
        repository declaration. Place planting is retired and fails closed.
        Submitting this form creates only an ordinary issue for archival review.
        It does not create a repository, identity, registry entry, network
        membership, page, seed, installer action, or accepted RAPP/1 artifact.

  - type: input
    id: historical_name
    attributes:
      label: Historical place name
      description: Optional public name used to identify the archived proposal.
      placeholder: e.g., Pike Place Market

  - type: textarea
    id: historical_context
    attributes:
      label: Historical context
      description: Explain why this retired proposal is being recorded. Do not include precise personal locations, secrets, credentials, or private data.
    validations:
      required: true

  - type: checkboxes
    id: blocked_acknowledgement
    attributes:
      label: Blocked-state acknowledgement
      options:
        - label: I understand this is historical issue intake only and no planting, joining, installation, or network action will occur.
          required: true
