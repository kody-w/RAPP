<!doctype html>
<!--
  Historical source restored from commit
  6bd45f00981959a3fdfcc64fb32608533aae5021,
  git blob a0ca7b2708bb540b1660ae39701a31d259eaeacd.

  PeerJS is loaded only from the loopback server's caller-supplied bundle.
  Broker options are supplied by the explicitly opted-in Node harness.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src http: https: ws: wss:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
  >
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAPP OSI L4a — supplied PeerJS tether fixture</title>
  <style>
    body {
      max-width: 720px;
      padding: 16px;
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    pre {
      min-height: 1.4em;
      padding: 8px;
      border-radius: 4px;
      background: #f4f4f4;
    }

    .row {
      display: flex;
      gap: 8px;
      margin: 8px 0;
    }

    input {
      flex: 1;
      padding: 6px 8px;
      font: inherit;
    }

    button {
      padding: 6px 12px;
      font: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>L4a — WebRTC tether fixture</h1>
  <p>
    This retains the historical two-peer DataChannel implementation. The
    runner serves a supplied PeerJS bundle locally and injects explicit broker
    configuration; this page has no CDN or credential dependency.
  </p>

  <div>
    <strong>My peer ID:</strong>
    <pre id="my-peer-id">connecting…</pre>
  </div>

  <div class="row">
    <input id="other-peer-id" placeholder="enter the other device's peer id">
    <button id="connect" type="button">Connect</button>
  </div>

  <div>
    <strong>Status:</strong>
    <pre id="status">idle</pre>
  </div>

  <div>
    <strong>Messages received:</strong>
    <pre id="messages"></pre>
  </div>

  <div class="row">
    <input
      id="message-input"
      placeholder="message to send"
      value="hello over the tether"
    >
    <button id="send" type="button">Send</button>
  </div>

  <script src="/runtime-config.js"></script>
  <script src="/peerjs.min.js"></script>
  <script>
    "use strict";

    const $ = (id) => document.getElementById(id);
    const setStatus = (status) => {
      $("status").textContent = status;
    };
    const appendMessage = (message) => {
      const current = $("messages").textContent;
      $("messages").textContent = current ? current + "\n" + message : message;
    };

    let peer = null;
    let connection = null;
    const events = [];

    function logEvent(where, what, extra) {
      events.push({
        t: Date.now(),
        where,
        what,
        extra: extra ? String(extra).slice(0, 300) : "",
      });
    }

    function attachConnectionHandlers(candidate) {
      logEvent("conn", "attach", candidate.peer);
      candidate.on("open", () => {
        logEvent("conn", "open", candidate.peer);
        setStatus("connected");
      });
      candidate.on("data", (data) => {
        logEvent("conn", "data", typeof data);
        appendMessage(typeof data === "string" ? data : JSON.stringify(data));
      });
      candidate.on("close", () => {
        logEvent("conn", "close", candidate.peer);
        setStatus("closed");
      });
      candidate.on("error", (error) => {
        const detail = error && error.message || error;
        logEvent("conn", "error", detail);
        setStatus("error: " + detail);
      });
    }

    function ensurePeer() {
      if (peer) return peer;
      if (typeof window.Peer !== "function") {
        throw new Error("supplied PeerJS bundle did not expose window.Peer");
      }
      if (!window.__RAPP_PEER_OPTIONS) {
        throw new Error("explicit PeerJS broker options were not supplied");
      }

      peer = new window.Peer(undefined, window.__RAPP_PEER_OPTIONS);
      peer.on("open", (id) => {
        logEvent("peer", "open", id);
        $("my-peer-id").textContent = id;
        setStatus("registered");
      });
      peer.on("connection", (candidate) => {
        logEvent("peer", "incoming-connection", candidate.peer);
        connection = candidate;
        attachConnectionHandlers(candidate);
      });
      peer.on("error", (error) => {
        const detail = error && (error.type + ": " + error.message) || String(error);
        logEvent("peer", "error", detail);
        setStatus("peer-error: " + (error && error.type || error));
      });
      peer.on("disconnected", () => logEvent("peer", "disconnected"));
      peer.on("close", () => logEvent("peer", "close"));
      return peer;
    }

    function connectToPeer(id) {
      ensurePeer();
      connection = peer.connect(id, { reliable: true });
      attachConnectionHandlers(connection);
    }

    function sendMessage(text) {
      if (!connection || !connection.open) return false;
      connection.send({
        schema: "rapp-tether/1.0",
        text,
        from: peer && peer.id,
      });
      return true;
    }

    $("connect").addEventListener("click", () => {
      const id = $("other-peer-id").value.trim();
      if (id) connectToPeer(id);
    });
    $("send").addEventListener("click", () => {
      sendMessage($("message-input").value);
    });

    ensurePeer();

    window.__rappTest = {
      getMyId: () => $("my-peer-id").textContent,
      getStatus: () => $("status").textContent,
      getMessages: () => $("messages").textContent,
      getEvents: () => events.slice(),
      getPeerState: () => ({
        id: peer && peer.id,
        open: peer && peer.open,
        destroyed: peer && peer.destroyed,
        disconnected: peer && peer.disconnected,
        connections: peer && Object.keys(peer.connections || {}),
      }),
      startConnect: (id) => {
        ensurePeer();
        const candidate = peer.connect(id, {
          reliable: true,
          serialization: "json",
        });
        attachConnectionHandlers(candidate);
        connection = candidate;
        return { ok: true, peer: id };
      },
      connectTo: (id) => new Promise((resolve, reject) => {
        ensurePeer();
        const candidate = peer.connect(id, {
          reliable: true,
          serialization: "json",
        });
        attachConnectionHandlers(candidate);
        connection = candidate;
        candidate.on("open", () => resolve("open"));
        candidate.on("error", (error) => {
          reject(new Error(error && error.message || String(error)));
        });
        setTimeout(() => reject(new Error("connectTo timeout")), 25000);
      }),
      send: (text) => sendMessage(text),
    };
  </script>
</body>
</html>
